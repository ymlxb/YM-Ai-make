services:
  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: 7001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "7001:7001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:7001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:7001
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:7001
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
